<script>
'use strict';
const STORAGE_KEY = 'lifeos-v1-data';
const $ = (selector, root=document) => root.querySelector(selector);
const $$ = (selector, root=document) => [...root.querySelectorAll(selector)];
const todayKey = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2,10)}`;
const defaultData = () => ({version:1,profile:{name:'Друг',dailyStudyGoal:120},tasks:[],habits:[],notes:[],transactions:[],studySessions:[]});
function loadData(){
  try {
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const d=JSON.parse(raw);
    if(!d || typeof d!=='object') return defaultData();
    const base=defaultData();
    return {...base,...d,profile:{...base.profile,...(d.profile||{})},tasks:Array.isArray(d.tasks)?d.tasks:[],habits:Array.isArray(d.habits)?d.habits:[],notes:Array.isArray(d.notes)?d.notes:[],transactions:Array.isArray(d.transactions)?d.transactions:[],studySessions:Array.isArray(d.studySessions)?d.studySessions:[]};
  } catch(e){return defaultData();}
}
let data=loadData();
let currentPage='home';
let taskFilter='all';
let taskSearch='';
let activeNoteId=null;
let timerMode='work';
let timerSeconds=25*60;
let timerRunning=false;
let timerInterval=null;
let studyPeriod='week';
const pageTitles={home:'Твой обзор',tasks:'Твои задачи',study:'Учёба и фокус',habits:'Полезные привычки',notes:'Твои заметки',budget:'Личный бюджет',settings:'Настройки'};
function saveData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));return true;}catch(e){toast('Не удалось сохранить данные. Возможно, в браузере закончилась память.','error');return false;}}
function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function fmtDate(dateKey, opts={day:'numeric',month:'short'}){if(!dateKey)return 'Без срока';const d=new Date(`${dateKey}T12:00:00`);if(Number.isNaN(d.getTime()))return esc(dateKey);return new Intl.DateTimeFormat('ru-RU',opts).format(d);}
function formatMoney(n){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(n)||0)+' ₸';}
function timeText(mins){mins=Math.max(0,Math.round(mins||0));const h=Math.floor(mins/60),m=mins%60;return h?`${h} ч ${m} мин`:`${m} мин`;}
function toast(message,type='success'){const wrap=$('#toast-wrap');const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=message;wrap.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(5px)';setTimeout(()=>el.remove(),220);},3000);}
function greet(){const h=new Date().getHours();return h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер';}
function updateHeader(){const now=new Date();$('#top-date').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(now);$('#top-clock').textContent=new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit'}).format(now);$('#top-title').textContent=pageTitles[currentPage]||pageTitles.home;const initial=(data.profile.name||'Я').trim().charAt(0).toUpperCase()||'Я';$('#avatar').textContent=initial;$('#nav-tasks').textContent=data.tasks.filter(t=>!t.done).length;$('#nav-habits').textContent=data.habits.length;$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));}
function studyMinsForDay(day){return data.studySessions.filter(s=>s.date===day).reduce((sum,s)=>sum+(Number(s.minutes)||0),0);}
function isDoneToday(habit){return Array.isArray(habit.completedDates)&&habit.completedDates.includes(todayKey());}
function currentStreak(habit){const done=new Set(Array.isArray(habit.completedDates)?habit.completedDates:[]);let d=new Date();if(!done.has(todayKey()))d.setDate(d.getDate()-1);let count=0;for(let i=0;i<370;i++){if(done.has(todayKey(d))){count++;d.setDate(d.getDate()-1);}else break;}return count;}
function taskTag(priority){const map={high:['Высокий','high'],medium:['Средний','medium'],low:['Низкий','low']};const pair=map[priority]||map.medium;return `<span class="tag ${pair[1]}">${pair[0]}</span>`;}
function renderTaskRow(task){const overdue=!task.done&&task.due&&task.due<todayKey();return `<div class="task-row ${task.done?'done':''}" data-task-row="${esc(task.id)}"><button class="task-check ${task.done?'checked':''}" data-action="toggle-task" data-id="${esc(task.id)}" aria-label="${task.done?'Отметить невыполненной':'Отметить выполненной'}">${task.done?'✓':''}</button><div class="task-main"><div class="task-name">${esc(task.title)}</div><div class="task-meta"><span>${task.category==='study'?'Учёба':task.category==='work'?'Работа':task.category==='personal'?'Личное':'Другое'}</span><span>·</span><span style="${overdue?'color:#c45158;font-weight:800':''}">${task.due?(overdue?'Просрочено · ':'')+fmtDate(task.due):'Без срока'}</span>${task.priority?taskTag(task.priority):''}</div></div><div class="task-actions"><button class="icon-btn" data-action="edit-task" data-id="${esc(task.id)}" title="Изменить" aria-label="Изменить задачу">✎</button><button class="icon-btn" data-action="delete-task" data-id="${esc(task.id)}" title="Удалить" aria-label="Удалить задачу">×</button></div></div>`;}
function emptyState(icon,title,desc){return `<div class="empty"><div class="empty-icon">${icon}</div><strong>${esc(title)}</strong><div style="margin-top:4px">${esc(desc)}</div></div>`;}
function renderHome(){
  const today=todayKey(),open=data.tasks.filter(t=>!t.done),due=open.filter(t=>!t.due||t.due<=today),doneToday=data.tasks.filter(t=>t.done&&t.completedAt===today).length;
  const todaysMins=studyMinsForDay(today),goal=Math.max(1,Number(data.profile.dailyStudyGoal)||120),studyPct=Math.min(100,Math.round(todaysMins/goal*100));
  const income=data.transactions.filter(t=>t.type==='income').reduce((a,t)=>a+Number(t.amount||0),0),expense=data.transactions.filter(t=>t.type==='expense').reduce((a,t)=>a+Number(t.amount||0),0);
  const todo=[...open].sort((a,b)=>{const ad=a.due||'9999-12-31',bd=b.due||'9999-12-31';return ad.localeCompare(bd);}).slice(0,5);
  const habits=data.habits.slice(0,4);
  return `<section class="welcome"><div class="welcome-text"><div class="welcome-kicker">${greet()}${data.profile.name&&data.profile.name!=='Друг'?', '+esc(data.profile.name):'!'}</div><h2>Маленькие шаги.<br>Большие результаты.</h2><p>Собери день вокруг того, что для тебя важно. Один экран — задачи, учёба, привычки и деньги.</p></div><div class="welcome-date"><strong>${new Intl.DateTimeFormat('ru-RU',{day:'2-digit'}).format(new Date())}</strong>${new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(new Date())}<div style="margin-top:15px"><button class="btn btn-primary btn-small" data-action="go-tasks">＋ Новая задача</button></div></div></section>
  <section class="stats"><article class="stat"><div class="stat-head"><span>Открытые задачи</span><span class="stat-icon">☑</span></div><div class="stat-value">${open.length}</div><div class="stat-foot"><b>${due.length}</b> требуют внимания</div></article><article class="stat"><div class="stat-head"><span>Учёба сегодня</span><span class="stat-icon">◷</span></div><div class="stat-value">${timeText(todaysMins)}</div><div class="stat-foot">Цель: ${timeText(goal)}</div></article><article class="stat"><div class="stat-head"><span>Привычки сегодня</span><span class="stat-icon">✳</span></div><div class="stat-value">${data.habits.filter(isDoneToday).length}<span style="font-size:15px;color:#a0a8b6"> / ${data.habits.length}</span></div><div class="stat-foot">${data.habits.length?Math.round(data.habits.filter(isDoneToday).length/data.habits.length*100)+'% выполнено':'Добавь первую привычку'}</div></article><article class="stat"><div class="stat-head"><span>Баланс</span><span class="stat-icon">₸</span></div><div class="stat-value" style="font-size:clamp(18px,2vw,26px)">${formatMoney(income-expense)}</div><div class="stat-foot">Доходы минус расходы</div></article></section>
  <div class="content-grid"><div class="stack"><section class="panel"><div class="panel-head"><div><h3 class="panel-title">На очереди</h3><div class="panel-subtitle">Сначала важное — потом остальное</div></div><button class="text-link" data-page="tasks">Все задачи →</button></div><div class="task-list">${todo.length?todo.map(renderTaskRow).join(''):emptyState('✓','Всё под контролем','Нет открытых задач. Добавь новую или отдохни.')}</div><form id="quick-task-form" class="quick-form"><input class="field" name="title" placeholder="Быстро добавить задачу…" maxlength="120" required><button class="btn btn-primary" type="submit">＋ Добавить</button></form></section>
  <section class="panel"><div class="panel-head"><div><h3 class="panel-title">Прогресс учёбы</h3><div class="panel-subtitle">Твой сегодняшний фокус</div></div><button class="text-link" data-page="study">Открыть →</button></div><div class="progress-row"><span>${timeText(todaysMins)} из ${timeText(goal)}</span><strong>${studyPct}%</strong></div><div class="progress"><span style="width:${studyPct}%"></span></div><div style="display:flex;justify-content:space-between;gap:12px;margin-top:13px;font-size:11px;color:var(--muted)"><span>Сегодня: ${data.studySessions.filter(s=>s.date===today).length} учебных сессий</span><span>${studyPct>=100?'Цель достигнута 🎉':'Продолжай в своём темпе'}</span></div></section></div>
  <div class="stack"><section class="panel"><div class="panel-head"><div><h3 class="panel-title">Привычки на сегодня</h3><div class="panel-subtitle">Регулярность важнее идеала</div></div><button class="text-link" data-page="habits">Все →</button></div>${habits.length?habits.map(h=>`<div class="habit-mini"><div class="habit-emoji">${esc(h.emoji||'✳')}</div><div class="habit-info"><strong>${esc(h.name)}</strong><small>${currentStreak(h)} дн. подряд</small></div><button class="habit-tick ${isDoneToday(h)?'done':''}" data-action="toggle-habit" data-id="${esc(h.id)}" aria-label="Отметить привычку">${isDoneToday(h)?'✓':''}</button></div>`).join(''):emptyState('✳','Пока нет привычек','Добавь то, что хочешь делать регулярно.')}<button class="btn btn-light w-full mt-12" data-action="go-habits">＋ Добавить привычку</button></section>
  <section class="panel"><div class="panel-head"><div><h3 class="panel-title">Последние заметки</h3><div class="panel-subtitle">Идеи не должны теряться</div></div><button class="text-link" data-page="notes">Все →</button></div>${data.notes.length?[...data.notes].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,3).map(n=>`<button class="note-item" style="width:100%;margin-bottom:6px" data-action="open-note" data-id="${esc(n.id)}"><strong>${esc(n.title||'Без названия')}</strong><small>${fmtDate(todayKey(new Date(n.updatedAt||Date.now())),{day:'numeric',month:'short'})} · ${esc((n.body||'Пустая заметка').slice(0,52))}</small></button>`).join(''):emptyState('▤','Чистый лист','Сохрани идею, ссылку или план.')}<button class="btn btn-light w-full mt-12" data-action="new-note">＋ Новая заметка</button></section></div></div>`;
}
function renderTasks(){
 const tasks=[...data.tasks].filter(t=>!taskSearch||`${t.title} ${t.category}`.toLowerCase().includes(taskSearch.toLowerCase()));
 const groups=taskFilter==='done'?[['Выполненные',tasks.filter(t=>t.done)]]:taskFilter==='today'?[['На сегодня и раньше',tasks.filter(t=>!t.done&&t.due&&t.due<=todayKey())]]:taskFilter==='all'?[['К выполнению',tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'))],['Завершено',tasks.filter(t=>t.done).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''))]]:[['Все задачи',tasks]];
 return `<div class="section-heading"><div><h2>Задачи под контролем</h2><p>Разгрузи голову: запиши, расставь приоритеты и действуй.</p></div><button class="btn btn-primary" data-action="focus-new-task">＋ Новая задача</button></div><div class="task-layout"><section class="panel"><div class="task-tools mb-12"><input class="field search" id="task-search" value="${esc(taskSearch)}" placeholder="⌕ Поиск задач…" aria-label="Поиск задач"><span class="muted" style="font-size:11px;white-space:nowrap">${data.tasks.filter(t=>!t.done).length} открыто</span></div><div class="filters">${[['all','Все'],['today','На сегодня'],['done','Выполненные']].map(([v,l])=>`<button class="filter-btn ${taskFilter===v?'active':''}" data-action="task-filter" data-value="${v}">${l}</button>`).join('')}</div>${groups.map(([label,arr])=>`<div class="list-title">${label}<span class="count-badge">${arr.length}</span></div><div class="task-list">${arr.length?arr.map(renderTaskRow).join(''):emptyState(label==='Завершено'?'✓':'☑',label==='Завершено'?'Здесь появятся выполненные задачи':'Список пуст','Добавь задачу или измени фильтр.')}</div>`).join('')}</section><section class="panel" id="task-form-panel"><div class="panel-head"><div><h3 class="panel-title" id="task-form-heading">Новая задача</h3><div class="panel-subtitle">Заполни самое важное</div></div><span style="font-size:22px">✎</span></div><form id="task-form"><input type="hidden" name="id"><div class="form-grid"><div class="form-field full"><label for="task-title">Название</label><input class="field" id="task-title" name="title" placeholder="Например, повторить английский" maxlength="120" required></div><div class="form-field"><label for="task-category">Категория</label><select class="field" id="task-category" name="category"><option value="personal">Личное</option><option value="study">Учёба</option><option value="work">Работа</option><option value="other">Другое</option></select></div><div class="form-field"><label for="task-priority">Приоритет</label><select class="field" id="task-priority" name="priority"><option value="medium">Средний</option><option value="high">Высокий</option><option value="low">Низкий</option></select></div><div class="form-field full"><label for="task-due">Срок (необязательно)</label><input class="field" id="task-due" name="due" type="date"></div></div><div class="form-actions"><button class="btn btn-primary" type="submit" id="task-submit">Сохранить задачу</button><button class="btn btn-ghost" type="reset" id="task-cancel" hidden>Отмена</button></div></form><div class="settings-section mt-12"><h3>Небольшой совет</h3><p>Если задача кажется слишком большой, разбей её на шаги по 15–30 минут. Так проще начать.</p></div></section></div>`;
}
function renderStudy(){
 const today=todayKey(),todayMins=studyMinsForDay(today),goal=Math.max(1,Number(data.profile.dailyStudyGoal)||120),pct=Math.min(100,Math.round(todayMins/goal*100));
 const days=studyPeriod==='week'?7:30;const dataDays=[];for(let i=days-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=todayKey(d);dataDays.push({key:k,label:new Intl.DateTimeFormat('ru-RU',{weekday:days===7?'short':undefined,day:days===30?'numeric':undefined}).format(d),mins:studyMinsForDay(k)});}const max=Math.max(30,...dataDays.map(d=>d.mins));
 const sessions=[...data.studySessions].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,8);
 return `<div class="section-heading"><div><h2>Учись с фокусом</h2><p>Работай короткими отрезками, делай перерывы и отмечай прогресс.</p></div></div><div class="content-grid"><div class="stack"><section class="panel"><div class="panel-head"><div><h3 class="panel-title">Твой прогресс</h3><div class="panel-subtitle">Сегодняшняя цель — ${timeText(goal)}</div></div><span style="font-size:21px">◷</span></div><div style="font-size:31px;font-weight:850;letter-spacing:-1.2px">${timeText(todayMins)} <span style="font-size:13px;color:var(--muted);font-weight:600">из ${timeText(goal)}</span></div><div class="progress-row"><span>До цели осталось ${timeText(Math.max(0,goal-todayMins))}</span><strong>${pct}%</strong></div><div class="progress"><span style="width:${pct}%"></span></div><div style="margin-top:17px"><form id="study-log-form"><div class="form-grid"><div class="form-field"><label for="study-subject">Предмет</label><select class="field" name="subject" id="study-subject"><option>Английский</option><option>Программирование</option><option>Подготовка к поступлению</option><option>Колледж</option><option>Другое</option></select></div><div class="form-field"><label for="study-minutes">Минуты</label><input class="field" type="number" min="1" max="1440" name="minutes" id="study-minutes" value="25" required></div></div><div class="form-actions"><button type="submit" class="btn btn-primary">＋ Записать учебную сессию</button></div></form></div></section><section class="panel"><div class="panel-head"><div><h3 class="panel-title">Активность по дням</h3><div class="panel-subtitle">Смотри на регулярность, не на идеальные дни</div></div><div class="filters" style="margin:0"><button class="filter-btn ${studyPeriod==='week'?'active':''}" data-action="study-period" data-value="week">7 дней</button><button class="filter-btn ${studyPeriod==='month'?'active':''}" data-action="study-period" data-value="month">30 дней</button></div></div><div class="chart-bars">${dataDays.map(d=>`<div class="chart-col" title="${esc(d.key)}: ${timeText(d.mins)}"><small>${d.mins?d.mins+'м':''}</small><div class="chart-bar" style="height:${Math.max(4,d.mins/max*88)}%"></div><span>${esc(d.label)}</span></div>`).join('')}</div></section></div><div class="stack"><section class="timer-card"><div class="timer-label" id="timer-label">${timerMode==='work'?'Время фокусироваться':'Время отдохнуть'}</div><div class="timer-display" id="timer-display">${String(Math.floor(timerSeconds/60)).padStart(2,'0')}:${String(timerSeconds%60).padStart(2,'0')}</div><div class="timer-caption" id="timer-caption">${timerRunning?'Таймер запущен — держи фокус':'Один шаг за раз. Ты справишься.'}</div><div class="timer-controls"><button class="btn btn-primary" data-action="timer-toggle" id="timer-toggle">${timerRunning?'Ⅱ Пауза':'▶ Старт'}</button><button class="btn btn-light" data-action="timer-reset">↻ Сбросить</button></div><div class="timer-mode"><button class="${timerMode==='work'?'active':''}" data-action="timer-mode" data-value="work">Фокус 25 мин</button><button class="${timerMode==='break'?'active':''}" data-action="timer-mode" data-value="break">Перерыв 5 мин</button></div></section><section class="panel"><div class="panel-head"><div><h3 class="panel-title">Последние занятия</h3><div class="panel-subtitle">История твоей работы</div></div></div>${sessions.length?sessions.map(s=>`<div class="study-log"><span class="study-dot" style="background:${s.subject==='Английский'?'#56b890':s.subject==='Программирование'?'#6b8afd':'#e8ad4c'}"></span><div class="study-log-main"><b>${esc(s.subject)}</b><small>${fmtDate(s.date,{day:'numeric',month:'short'})}</small></div><div class="study-mins">${s.minutes} мин</div><button class="icon-btn" data-action="delete-study" data-id="${esc(s.id)}" aria-label="Удалить сессию">×</button></div>`).join(''):emptyState('◷','Пока нет записей','Запиши время после учёбы — здесь появится история.')}</section></div></div>`;
}
function renderHabits(){return `<div class="section-heading"><div><h2>Привычки строят систему</h2><p>Не нужно делать всё идеально. Достаточно возвращаться к важному.</p></div></div><section class="panel mb-12"><div class="panel-head"><div><h3 class="panel-title">Добавить привычку</h3><div class="panel-subtitle">Одна маленькая привычка лучше десятка обещаний</div></div></div><form id="habit-form"><div class="form-grid"><div class="form-field"><label for="habit-name">Название привычки</label><input class="field" id="habit-name" name="name" maxlength="80" placeholder="Например, английский 20 минут" required></div><div class="form-field"><label for="habit-emoji">Значок</label><select class="field" id="habit-emoji" name="emoji"><option value="📚">📚 Учёба</option><option value="💧">💧 Вода</option><option value="🏃">🏃 Движение</option><option value="🧘">🧘 Спокойствие</option><option value="💻">💻 Навык</option><option value="🌙">🌙 Сон</option><option value="✳">✳ Другое</option></select></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">＋ Добавить привычку</button></div></form></section><div class="panel-head" style="margin:20px 2px 12px"><div><h3 class="panel-title">Сегодня · ${fmtDate(todayKey(),{day:'numeric',month:'long'})}</h3><div class="panel-subtitle">${data.habits.filter(isDoneToday).length} из ${data.habits.length} выполнено</div></div><strong style="font-size:14px">${data.habits.length?Math.round(data.habits.filter(isDoneToday).length/data.habits.length*100):0}%</strong></div><div class="progress mb-12"><span style="width:${data.habits.length?data.habits.filter(isDoneToday).length/data.habits.length*100:0}%"></span></div><div class="habit-grid">${data.habits.length?data.habits.map(h=>`<article class="habit-card"><div class="habit-card-top"><div class="habit-large-emoji">${esc(h.emoji||'✳')}</div><button class="icon-btn" data-action="delete-habit" data-id="${esc(h.id)}" title="Удалить привычку" aria-label="Удалить привычку">×</button></div><h3>${esc(h.name)}</h3><p>Создана ${fmtDate(h.createdDate||todayKey(),{day:'numeric',month:'short'})}</p><div class="habit-streak">🔥 ${currentStreak(h)} ${currentStreak(h)===1?'день':currentStreak(h)>=2&&currentStreak(h)<=4?'дня':'дней'} подряд</div><button class="habit-toggle ${isDoneToday(h)?'done':''}" data-action="toggle-habit" data-id="${esc(h.id)}">${isDoneToday(h)?'✓ Выполнено сегодня':'Отметить за сегодня'}</button></article>`).join(''):emptyState('✳','Создай первую привычку','Например: читать 10 минут, заниматься английским или делать растяжку.')}</div>`;}
function renderNotes(){const notes=[...data.notes].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));if(!activeNoteId||!notes.some(n=>n.id===activeNoteId))activeNoteId=notes[0]?.id||null;const note=notes.find(n=>n.id===activeNoteId);return `<div class="section-heading"><div><h2>Место для мыслей</h2><p>Заметки сохраняются автоматически на этом устройстве.</p></div><button class="btn btn-primary" data-action="new-note">＋ Новая заметка</button></div><section class="panel"><div class="note-layout"><aside><div class="panel-head"><h3 class="panel-title">Мои заметки <span class="count-badge">${notes.length}</span></h3></div><div class="note-list">${notes.length?notes.map(n=>`<button class="note-item ${n.id===activeNoteId?'active':''}" data-action="open-note" data-id="${esc(n.id)}"><strong>${esc(n.title||'Без названия')}</strong><small>${fmtDate(todayKey(new Date(n.updatedAt||Date.now())),{day:'numeric',month:'short'})} · ${esc((n.body||'Пустая заметка').replace(/\s+/g,' ').slice(0,35))}</small></button>`).join(''):emptyState('▤','Пока пусто','Создай заметку.')}</div></aside><div class="note-editor">${note?`<input class="note-title" id="note-title" aria-label="Название заметки" value="${esc(note.title)}" placeholder="Название заметки" maxlength="120"><textarea class="note-body" id="note-body" aria-label="Текст заметки" placeholder="Запиши идею, план, ссылку или мысли…">${esc(note.body||'')}</textarea><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span class="note-status" id="note-status">✓ Сохранено</span><button class="btn btn-danger btn-small" data-action="delete-note" data-id="${esc(note.id)}">Удалить заметку</button></div>`:`<div style="margin:auto;width:100%">${emptyState('✎','Начни с чистого листа','Нажми «Новая заметка», чтобы сохранить мысль.')}</div>`}</div></div></section>`;}
function renderBudget(){const inc=data.transactions.filter(t=>t.type==='income').reduce((a,t)=>a+Number(t.amount||0),0),exp=data.transactions.filter(t=>t.type==='expense').reduce((a,t)=>a+Number(t.amount||0),0);const tx=[...data.transactions].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));const recent=tx.slice(0,10);const expensesByCat={};data.transactions.filter(t=>t.type==='expense').forEach(t=>expensesByCat[t.category||'Другое']=(expensesByCat[t.category||'Другое']||0)+Number(t.amount||0));const top=Object.entries(expensesByCat).sort((a,b)=>b[1]-a[1]).slice(0,4);return `<div class="section-heading"><div><h2>Деньги без хаоса</h2><p>Записывай доходы и расходы, чтобы понимать, куда уходят деньги.</p></div></div><div class="money-summary"><div class="money-box"><small>Текущий баланс</small><strong>${formatMoney(inc-exp)}</strong></div><div class="money-box income"><small>Все доходы</small><strong>+${formatMoney(inc)}</strong></div><div class="money-box expense"><small>Все расходы</small><strong>−${formatMoney(exp)}</strong></div></div><div class="content-grid"><section class="panel"><div class="panel-head"><div><h3 class="panel-title">История операций</h3><div class="panel-subtitle">${tx.length} ${tx.length===1?'операция':tx.length>=2&&tx.length<=4?'операции':'операций'} всего</div></div></div>${recent.length?recent.map(t=>`<div class="money-list-item"><div class="money-symbol">${t.type==='income'?'↙':'↗'}</div><div class="money-main"><b>${esc(t.title||'Без названия')}</b><small>${esc(t.category||'Другое')} · ${fmtDate(t.date||todayKey(),{day:'numeric',month:'short',year:'numeric'})}</small></div><span class="money-amount ${t.type==='income'?'plus':'minus'}">${t.type==='income'?'+':'−'}${formatMoney(t.amount)}</span><button class="icon-btn" data-action="delete-transaction" data-id="${esc(t.id)}" aria-label="Удалить операцию">×</button></div>`).join(''):emptyState('₸','Операций пока нет','Добавь доход или расход справа.')}</section><div class="stack"><section class="panel"><div class="panel-head"><div><h3 class="panel-title">Добавить операцию</h3><div class="panel-subtitle">Сумма в тенге (₸)</div></div></div><form id="money-form"><div class="form-grid"><div class="form-field"><label for="money-type">Тип</label><select class="field" id="money-type" name="type"><option value="expense">Расход</option><option value="income">Доход</option></select></div><div class="form-field"><label for="money-amount">Сумма, ₸</label><input class="field" id="money-amount" name="amount" type="number" min="0.01" step="0.01" placeholder="2500" required></div><div class="form-field full"><label for="money-title">Описание</label><input class="field" id="money-title" name="title" maxlength="100" placeholder="Например, продукты" required></div><div class="form-field"><label for="money-category">Категория</label><select class="field" id="money-category" name="category"><option>Еда</option><option>Транспорт</option><option>Учёба</option><option>Жильё</option><option>Зарплата</option><option>Покупки</option><option>Развлечения</option><option>Другое</option></select></div><div class="form-field"><label for="money-date">Дата</label><input class="field" id="money-date" name="date" type="date" value="${todayKey()}" required></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Сохранить операцию</button></div></form></section><section class="panel"><div class="panel-head"><div><h3 class="panel-title">Крупные категории</h3><div class="panel-subtitle">Распределение всех записанных расходов</div></div></div>${top.length?top.map(([cat,amount])=>`<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;gap:10px;font-size:11px;margin-bottom:6px"><span>${esc(cat)}</span><strong>${formatMoney(amount)}</strong></div><div class="progress"><span style="width:${exp?amount/exp*100:0}%;background:linear-gradient(90deg,#6d8afa,#9aaaff)"></span></div></div>`).join(''):'<div class="muted" style="font-size:12px">Добавь расходы, чтобы увидеть распределение.</div>'}</section></div></div>`;}
function renderSettings(){return `<div class="section-heading"><div><h2>Настрой LifeOS под себя</h2><p>Измени персональные параметры и управляй резервными копиями.</p></div></div><section class="panel"><div class="settings-section"><h3>Профиль</h3><p>Имя используется только для приветствия на главной странице.</p><form id="profile-form"><div class="form-grid"><div class="form-field"><label for="profile-name">Как к тебе обращаться</label><input class="field" id="profile-name" name="name" maxlength="40" value="${esc(data.profile.name||'')}" placeholder="Имя"></div><div class="form-field"><label for="daily-goal">Ежедневная цель учёбы (минуты)</label><input class="field" id="daily-goal" name="goal" type="number" min="1" max="1440" value="${Math.max(1,Number(data.profile.dailyStudyGoal)||120)}" required></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Сохранить настройки</button></div></form></div><div class="settings-section"><h3>Резервная копия</h3><p>Скачай свои данные в JSON-файл. Его можно сохранить в надёжном месте или импортировать в этом браузере. Экспорт содержит задачи, привычки, заметки, учёбу и бюджет.</p><div class="settings-actions"><button class="btn btn-light" data-action="export-data">⇩ Скачать резервную копию</button><button class="btn btn-light" data-action="import-data">⇧ Импортировать JSON</button></div></div><div class="settings-section"><h3>Приватность и хранение</h3><p>LifeOS работает локально. Данные хранятся в localStorage этого браузера: очистка данных браузера или переход на другое устройство могут удалить их. Резервная копия поможет сохранить информацию.</p><div class="settings-actions"><button class="btn btn-danger" data-action="reset-data">Удалить все данные</button></div></div><div class="settings-section"><h3>Справка</h3><p><b>Установка не нужна.</b> Открой HTML-файл в современном браузере. Для сохранения данных разреши браузеру хранить данные сайта. Таймер работает, пока открыта страница; некоторые браузеры могут замедлять таймер в фоновой вкладке.</p><p style="margin-bottom:0">Версия 1.0 · Работает без сторонних библиотек и без интернета.</p></div></section>`;}
function render(){updateHeader();const content=$('#page-content');const pages={home:renderHome,tasks:renderTasks,study:renderStudy,habits:renderHabits,notes:renderNotes,budget:renderBudget,settings:renderSettings};content.innerHTML=(pages[currentPage]||renderHome)();updateTimerDisplay();}
function go(page){if(!pageTitles[page])return;currentPage=page;render();window.scrollTo({top:0,behavior:'smooth'});}
function addTask(title,extra={}){const cleaned=String(title||'').trim();if(!cleaned){toast('Напиши название задачи.','error');return;}data.tasks.push({id:uid(),title:cleaned,category:extra.category||'personal',priority:extra.priority||'medium',due:extra.due||'',done:false,createdAt:Date.now(),completedAt:null});saveData();toast('Задача добавлена.');}
function toggleTask(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;t.completedAt=t.done?todayKey():null;saveData();render();}
function editTask(id){const t=data.tasks.find(x=>x.id===id);if(!t){return;}go('tasks');const form=$('#task-form');form.elements.id.value=t.id;form.elements.title.value=t.title;form.elements.category.value=t.category||'personal';form.elements.priority.value=t.priority||'medium';form.elements.due.value=t.due||'';$('#task-form-heading').textContent='Изменить задачу';$('#task-submit').textContent='Сохранить изменения';$('#task-cancel').hidden=false;$('#task-title').focus();}
function deleteById(collectionName,id){const arr=data[collectionName];const index=arr.findIndex(x=>x.id===id);if(index<0)return false;arr.splice(index,1);saveData();return true;}
function toggleHabit(id){const h=data.habits.find(x=>x.id===id);if(!h)return;h.completedDates=Array.isArray(h.completedDates)?h.completedDates:[];const today=todayKey();h.completedDates=h.completedDates.includes(today)?h.completedDates.filter(d=>d!==today):[...h.completedDates,today];saveData();render();toast(h.completedDates.includes(today)?'Привычка отмечена!':'Отметка снята.');}
function newNote(){const n={id:uid(),title:'Новая заметка',body:'',createdAt:Date.now(),updatedAt:Date.now()};data.notes.unshift(n);activeNoteId=n.id;saveData();go('notes');const title=$('#note-title');if(title){title.focus();title.select();}}
function updateNoteField(field,value){const note=data.notes.find(n=>n.id===activeNoteId);if(!note)return;note[field]=value;note.updatedAt=Date.now();saveData();const status=$('#note-status');if(status)status.textContent='✓ Сохранено автоматически';}
function updateTimerDisplay(){const display=$('#timer-display');if(!display)return;display.textContent=`${String(Math.floor(timerSeconds/60)).padStart(2,'0')}:${String(timerSeconds%60).padStart(2,'0')}`;const label=$('#timer-label');if(label)label.textContent=timerMode==='work'?'Время фокусироваться':'Время отдохнуть';const caption=$('#timer-caption');if(caption)caption.textContent=timerRunning?'Таймер запущен — держи фокус':'Один шаг за раз. Ты справишься.';const toggle=$('#timer-toggle');if(toggle)toggle.textContent=timerRunning?'Ⅱ Пауза':'▶ Старт';$$('[data-action="timer-mode"]').forEach(b=>b.classList.toggle('active',b.dataset.value===timerMode));}
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}timerRunning=false;}
function startTimer(){if(timerRunning){stopTimer();updateTimerDisplay();return;}timerRunning=true;updateTimerDisplay();timerInterval=setInterval(()=>{timerSeconds--;if(timerSeconds<=0){stopTimer();timerSeconds=0;updateTimerDisplay();toast(timerMode==='work'?'Фокус-сессия завершена! Отметь учёбу и отдохни.':'Перерыв закончен. Готов к следующей сессии?');if('vibrate' in navigator)navigator.vibrate?.([100,70,100]);return;}updateTimerDisplay();},1000);}
function setTimerMode(mode){stopTimer();timerMode=mode;timerSeconds=(mode==='work'?25:5)*60;updateTimerDisplay();}
function exportData(){const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`lifeos-backup-${todayKey()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Резервная копия скачана.');}
function importDataObject(parsed){if(!parsed||typeof parsed!=='object'||!Array.isArray(parsed.tasks)||!Array.isArray(parsed.habits)||!Array.isArray(parsed.notes)||!Array.isArray(parsed.transactions)||!Array.isArray(parsed.studySessions)){throw new Error('Файл не похож на резервную копию LifeOS.');}data={...defaultData(),...parsed,profile:{...defaultData().profile,...(parsed.profile||{})}};saveData();activeNoteId=null;render();toast('Данные успешно импортированы.');}
function resetData(){data=defaultData();activeNoteId=null;taskFilter='all';taskSearch='';studyPeriod='week';stopTimer();timerMode='work';timerSeconds=25*60;saveData();render();toast('Данные удалены. Начинаем с чистого листа.');}
document.addEventListener('click',e=>{
 const pageButton=e.target.closest('[data-page]');if(pageButton){go(pageButton.dataset.page);return;}
 const b=e.target.closest('[data-action]');if(!b)return;const {action,id,value}=b.dataset;
 switch(action){
  case 'go-tasks':go('tasks');setTimeout(()=>$('#task-title')?.focus(),40);break;
  case 'go-habits':go('habits');setTimeout(()=>$('#habit-name')?.focus(),40);break;
  case 'focus-new-task':go('tasks');setTimeout(()=>$('#task-title')?.focus(),40);break;
  case 'toggle-task':toggleTask(id);break;
  case 'delete-task':if(confirm('Удалить эту задачу?')){deleteById('tasks',id);render();toast('Задача удалена.');}break;
  case 'edit-task':editTask(id);break;
  case 'task-filter':taskFilter=value;render();break;
  case 'toggle-habit':toggleHabit(id);break;
  case 'delete-habit':if(confirm('Удалить привычку вместе с её историей?')){deleteById('habits',id);render();toast('Привычка удалена.');}break;
  case 'new-note':newNote();break;
  case 'open-note':activeNoteId=id;go('notes');break;
  case 'delete-note':if(confirm('Удалить эту заметку?')){deleteById('notes',id);if(activeNoteId===id)activeNoteId=null;render();toast('Заметка удалена.');}break;
  case 'study-period':studyPeriod=value;render();break;
  case 'delete-study':if(confirm('Удалить эту запись об учёбе?')){deleteById('studySessions',id);render();}break;
  case 'timer-toggle':startTimer();break;
  case 'timer-reset':stopTimer();timerSeconds=(timerMode==='work'?25:5)*60;updateTimerDisplay();break;
  case 'timer-mode':setTimerMode(value);break;
  case 'delete-transaction':if(confirm('Удалить эту операцию?')){deleteById('transactions',id);render();toast('Операция удалена.');}break;
  case 'export-data':exportData();break;
  case 'import-data':$('#import-file').click();break;
  case 'reset-data':if(confirm('Точно удалить ВСЕ задачи, привычки, заметки, учебные записи и операции? Сначала скачай резервную копию, если она нужна.'))resetData();break;
 }
});
document.addEventListener('submit',e=>{
 const form=e.target;if(!(form instanceof HTMLFormElement))return;e.preventDefault();const fd=new FormData(form);
 if(form.id==='quick-task-form'){addTask(fd.get('title'));render();return;}
 if(form.id==='task-form'){const id=String(fd.get('id')||'');const title=String(fd.get('title')||'').trim();if(!title){toast('Название задачи обязательно.','error');return;}if(id){const t=data.tasks.find(x=>x.id===id);if(t)Object.assign(t,{title,category:String(fd.get('category')),priority:String(fd.get('priority')),due:String(fd.get('due')||'')});saveData();toast('Задача обновлена.');}else{addTask(title,{category:String(fd.get('category')),priority:String(fd.get('priority')),due:String(fd.get('due')||'')});}render();return;}
 if(form.id==='habit-form'){const name=String(fd.get('name')||'').trim();if(!name)return;data.habits.push({id:uid(),name,emoji:String(fd.get('emoji')||'✳'),createdDate:todayKey(),completedDates:[]});saveData();render();toast('Привычка добавлена.');return;}
 if(form.id==='study-log-form'){const subject=String(fd.get('subject')||'Другое');const minutes=Number(fd.get('minutes'));if(!Number.isFinite(minutes)||minutes<1||minutes>1440){toast('Введи количество минут от 1 до 1440.','error');return;}data.studySessions.push({id:uid(),subject,minutes:Math.round(minutes),date:todayKey(),createdAt:Date.now()});saveData();render();toast('Учебная сессия записана.');return;}
 if(form.id==='money-form'){const amount=Number(fd.get('amount'));if(!Number.isFinite(amount)||amount<=0){toast('Сумма должна быть больше нуля.','error');return;}data.transactions.push({id:uid(),type:String(fd.get('type')),amount,title:String(fd.get('title')||'').trim(),category:String(fd.get('category')||'Другое'),date:String(fd.get('date')||todayKey()),createdAt:Date.now()});saveData();render();toast('Операция сохранена.');return;}
 if(form.id==='profile-form'){const name=String(fd.get('name')||'').trim()||'Друг',goal=Number(fd.get('goal'));if(!Number.isFinite(goal)||goal<1||goal>1440){toast('Цель должна быть от 1 до 1440 минут.','error');return;}data.profile.name=name;data.profile.dailyStudyGoal=Math.round(goal);saveData();render();toast('Настройки сохранены.');return;}
});
document.addEventListener('reset',e=>{if(e.target.id==='task-form'){setTimeout(()=>{const f=$('#task-form');if(f){f.elements.id.value='';$('#task-form-heading').textContent='Новая задача';$('#task-submit').textContent='Сохранить задачу';$('#task-cancel').hidden=true;}},0);}});
document.addEventListener('input',e=>{
 if(e.target.id==='task-search'){const pos=e.target.selectionStart;taskSearch=e.target.value;const current=e.target.value;const content=$('#page-content');const scroll=window.scrollY;content.innerHTML=renderTasks();const next=$('#task-search');if(next){next.focus();next.setSelectionRange(pos,pos);}window.scrollTo(0,scroll);return;}
 if(e.target.id==='note-title')updateNoteField('title',e.target.value);
 if(e.target.id==='note-body')updateNoteField('body',e.target.value);
});
$('#import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!confirm('Импорт заменит текущие данные. Перед импортом рекомендуется скачать резервную копию. Продолжить?'))return;importDataObject(parsed);}catch(err){toast(err.message||'Не удалось прочитать JSON-файл.','error');}finally{e.target.value='';}});
setInterval(()=>{const now=$('#top-clock');if(now)now.textContent=new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit'}).format(new Date());},15000);
render();
</script>
</body>
</html>
